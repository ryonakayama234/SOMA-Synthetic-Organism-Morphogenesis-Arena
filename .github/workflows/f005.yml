name: F005 positive motor work and battery gate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: F001-F004 regression and F005 unit tests
        run: python -m unittest discover -s tests -v
      - name: F005 preregistered A-F and evidence replay
        run: python -m experiments.F005.run_suite --output-dir runs/F005-ci --replay-output-dir runs/F005-replay
      - name: Upload independent comparison and complete raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: F005-A-F-evidence
          path: |
            runs/F005-ci/
            runs/F005-replay/
          if-no-files-found: error
