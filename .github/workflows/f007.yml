name: F007 linked-cell motor and battery evidence

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    runs-on: ubuntu-latest
    env:
      # PR source commit is distinct from the synthetic test-merge checkout commit.
      SOMA_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: F001-F007 full regression
        run: python -m unittest discover -s tests -v
      - name: F007 independent oracle under optimized Python
        run: python -O -m unittest discover -s tests -p test_f007.py -v
      - name: Produce F007 nine runs and byte replay
        run: python -m experiments.F007.run_suite --output-dir runs/F007-ci --replay-output-dir runs/F007-replay
      - name: Upload F007 comparison and complete reproducibility evidence
        # Never upload incomplete evidence when a test, oracle, or replay fails.
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: F007-${{ matrix.python }}-evidence
          path: |
            runs/F007-ci/
            runs/F007-replay/
          if-no-files-found: error
