name: V002 verified read-only 2D archive projection

on:
  push:
    branches: [main]
    paths:
      - 'experiments/V002/**'
      - 'contracts/v002.view.v1.schema.json'
      - 'tests/test_v002.py'
      - '.github/workflows/v002.yml'
  pull_request:
    paths:
      - 'experiments/V002/**'
      - 'contracts/v002.view.v1.schema.json'
      - 'tests/test_v002.py'
      - '.github/workflows/v002.yml'

jobs:
  saved-projection:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install view-contract schema validator
        run: python -m pip install 'jsonschema>=4.22,<5'
      - name: Original source-independent archive and V002 projection tests
        run: |
          python -m unittest tests.test_v002 -v
          python -m unittest discover -s tests
      - name: Byte-identical replay and source archive integrity
        shell: bash
        run: |
          set -euo pipefail
          t="$(mktemp -d)"
          trap 'rm -rf "$t"' EXIT
          sha="$(git rev-parse HEAD)"
          python -m experiments.F022.run_suite --out "$t/f022"
          python -m experiments.F023.run_suite --out "$t/f023"
          for v in f022 f023; do
            python -m "experiments.${v^^}.verify" --root "$t/$v" --expected-source-sha "$sha"
          done
          python -m experiments.V002.project --left-root "$t/f022" --right-root "$t/f022" --left-world C01 --right-world C02 --expected-left-sha "$sha" --expected-right-sha "$sha" --trusted-left-anchor "checked-out:$sha" --trusted-right-anchor "checked-out:$sha" --out "$t/view-a"
          python -m experiments.V002.project --left-root "$t/f022" --right-root "$t/f022" --left-world C01 --right-world C02 --expected-left-sha "$sha" --expected-right-sha "$sha" --trusted-left-anchor "checked-out:$sha" --trusted-right-anchor "checked-out:$sha" --out "$t/view-b"
          cmp "$t/view-a/view.json" "$t/view-b/view.json"
          cmp "$t/view-a/index.html" "$t/view-b/index.html"
          python -m experiments.F022.attack_test --root "$t/f022"
          python -m experiments.F023.attack_test --root "$t/f023"
          python -m experiments.V002.verify_view --view "$t/view-a/view.json" --left-root "$t/f022" --right-root "$t/f022" --expected-left-sha "$sha" --expected-right-sha "$sha" --trusted-left-anchor "checked-out:$sha" --trusted-right-anchor "checked-out:$sha"
          python -m experiments.V002.project --left-root "$t/f023" --right-root "$t/f023" --left-world Q02 --right-world Q04 --expected-left-sha "$sha" --expected-right-sha "$sha" --trusted-left-anchor "checked-out:$sha" --trusted-right-anchor "checked-out:$sha" --out "$t/view-f023"
          python -m experiments.V002.verify_view --view "$t/view-f023/view.json" --left-root "$t/f023" --right-root "$t/f023" --expected-left-sha "$sha" --expected-right-sha "$sha" --trusted-left-anchor "checked-out:$sha" --trusted-right-anchor "checked-out:$sha"

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen-view and browser test dependencies
        run: |
          python -m pip install 'jsonschema>=4.22,<5' 'playwright>=1.49,<2'
          python -m playwright install --with-deps chromium
      - name: Build verified archived-only browser fixtures and inspect real Chromium DOM/SVG
        shell: bash
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/v002-browser"
          mkdir -p "$p"
          sha="$(git rev-parse HEAD)"
          python -m experiments.F022.run_suite --out "$p/f022"
          python -m experiments.F023.run_suite --out "$p/f023"
          python -m experiments.V002.project --left-root "$p/f022" --right-root "$p/f022" --left-world C13 --right-world C01 --expected-left-sha "$sha" --expected-right-sha "$sha" --trusted-left-anchor "checked-out:$sha" --trusted-right-anchor "checked-out:$sha" --out "$p/f022-view"
          python -m experiments.V002.project --left-root "$p/f023" --right-root "$p/f023" --left-world Q02 --right-world Q04 --expected-left-sha "$sha" --expected-right-sha "$sha" --trusted-left-anchor "checked-out:$sha" --trusted-right-anchor "checked-out:$sha" --out "$p/f023-view"
          python -m experiments.V002.project --left-root "$p/f022" --right-root "$p/f022" --left-world C05 --right-world C06 --expected-left-sha "$sha" --expected-right-sha "$sha" --trusted-left-anchor "checked-out:$sha" --trusted-right-anchor "checked-out:$sha" --out "$p/f022-null-hit"
          python -m experiments.V002.project --left-root "$p/f022" --right-root "$p/f022" --left-world C07 --right-world C08 --expected-left-sha "$sha" --expected-right-sha "$sha" --trusted-left-anchor "checked-out:$sha" --trusted-right-anchor "checked-out:$sha" --out "$p/f022-graze-separate"
          python -m experiments.V002.browser_smoke --f022 "$p/f022-view/index.html" --f023 "$p/f023-view/index.html" --out "$p/screenshots"
      - name: Upload illustrative browser screenshots (not physics evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v002-browser-screenshots
          path: ${{ runner.temp }}/v002-browser/screenshots/*.png
          if-no-files-found: ignore

      - name: Package verified self-contained offline HTML for human researcher interaction
        shell: bash
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/v002-browser"
          dst="$p/offline-human-review"
          mkdir -p "$dst"
          cp -R "$p/f022-view" "$dst/F022-C13-vs-C01"
          cp -R "$p/f022-null-hit" "$dst/F022-C05-vs-C06"
          cp -R "$p/f022-graze-separate" "$dst/F022-C07-vs-C08"
          cp -R "$p/f023-view" "$dst/F023-Q02-vs-Q04"
          cp experiments/V002/REVIEW_GATE.md "$dst/README.md"
          printf "CI source checkout: %s\nOriginal and derived oracles must pass before HTML publication.\n" "$(git rev-parse HEAD)" > "$dst/BUILD.txt"
          (cd "$dst" && sha256sum */index.html */view.json > SHA256SUMS.txt)
          test "$(find "$dst" -name index.html | wc -l)" -eq 4
          test "$(find "$dst" -name view.json | wc -l)" -eq 4
      - name: Upload actual offline researcher UI (not an acceptance finding)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v002-offline-manual-review
          path: ${{ runner.temp }}/v002-browser/offline-human-review/
          if-no-files-found: error
          retention-days: 30
