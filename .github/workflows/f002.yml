name: F002 integer energy ledger
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: F001 regression and F002 invariant tests
        run: python -m unittest discover -s tests -v
      - name: F002 A-F experiment suite
        run: python -m experiments.F002.run_suite --output-dir runs/F002-ci
      - name: Preserve raw traces, figures, rejection controls, manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: F002-A-F-evidence
          path: runs/F002-ci/
          if-no-files-found: error
