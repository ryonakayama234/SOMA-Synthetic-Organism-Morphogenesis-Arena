name: F021 frozen bilateral motor and independent evidence

on:
  pull_request:
    paths:
      - 'soma/f021.py'
      - 'experiments/F021/**'
      - 'tests/test_f021.py'
      - '.github/workflows/f021.yml'
      - 'docs/ARCHITECTURE.md'
      - 'docs/DATA_CONTRACTS.md'
      - 'findings/F021-validation.md'
  push:
    branches:
      - main
      - 'feat/F021-*'
    paths:
      - 'soma/f021.py'
      - 'experiments/F021/**'
      - 'tests/test_f021.py'
      - '.github/workflows/f021.yml'
      - 'docs/ARCHITECTURE.md'
      - 'docs/DATA_CONTRACTS.md'
      - 'findings/F021-validation.md'
  workflow_dispatch:

jobs:
  frozen-worlds:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: All inherited and F021 regressions
        run: |
          python -m unittest discover -s tests
          python -O -m unittest discover -s tests -p 'test_f021.py'
      - name: Frozen primary 4,608 worlds and independent verifier
        run: |
          python -m experiments.F021.run_suite --out /tmp/f021-worlds-a
          python -m experiments.F021.verify --root /tmp/f021-worlds-a
          python -m experiments.F021.attack_test --root /tmp/f021-worlds-a
          python -m experiments.F021.run_suite --out /tmp/f021-worlds-b
          python -m experiments.F021.verify --root /tmp/f021-worlds-b
          diff -r /tmp/f021-worlds-a /tmp/f021-worlds-b
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: f021-worlds-py${{ matrix.python-version }}
          path: /tmp/f021-worlds-a/
          retention-days: 30
